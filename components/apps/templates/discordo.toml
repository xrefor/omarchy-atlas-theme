# Generated by atlas-theme from the active Omarchy palette.
# This overlay owns only Discordo's visual theme. Behavior, keybinds, layout,
# authentication and other recipient preferences remain unchanged.

[theme.title]
alignment = "left"
normal_style = { foreground = "{{ secondary }}" }
active_style = { foreground = "{{ accent }}", attributes = "bold" }

[theme.footer]
alignment = "left"
normal_style = { foreground = "{{ secondary }}" }
active_style = { foreground = "{{ secondary }}" }

[theme.border]
enabled = true
padding = [0, 0, 1, 1]
normal_set = "plain"
active_set = "plain"
normal_style = { foreground = "{{ muted }}" }
active_style = { foreground = "{{ muted }}" }

[theme.guilds_tree]
graphics = false
graphics_color = "{{ muted }}"
online_style = { foreground = "{{ bright_green }}" }
idle_style = { foreground = "{{ bright_yellow }}" }
dnd_style = { foreground = "{{ bright_red }}" }
offline_style = { foreground = "{{ secondary }}" }

[theme.scroll_bar]
visibility = "auto"
glyph_set = "box_drawing"
track_style = { foreground = "{{ muted }}" }
thumb_style = { foreground = "{{ secondary }}" }

[theme.messages_list]
mention_style = { foreground = "{{ accent }}", attributes = "bold" }
emoji_style = { foreground = "{{ foreground }}" }
url_style = { foreground = "{{ bright_cyan }}", underline = "solid" }
attachment_style = { foreground = "{{ bright_cyan }}", underline = "solid" }
reaction_style = { foreground = "{{ secondary }}" }
own_reaction_style = { foreground = "{{ accent }}", attributes = "bold" }
message_style = { foreground = "{{ foreground }}", background = "{{ background }}" }
selected_message_style = { foreground = "{{ accent }}", background = "{{ selection }}", attributes = "bold" }

[theme.messages_list.embeds]
provider_style = { foreground = "{{ secondary }}", attributes = "italic" }
author_style = { foreground = "{{ bright_foreground }}" }
title_style = { foreground = "{{ bright_foreground }}", attributes = "bold" }
description_style = { foreground = "{{ foreground }}" }
field_name_style = { foreground = "{{ secondary }}", attributes = "bold" }
field_value_style = { foreground = "{{ foreground }}" }
footer_style = { foreground = "{{ secondary }}", attributes = "italic" }
url_style = { foreground = "{{ bright_cyan }}", underline = "solid" }

[theme.dialog]
style = { foreground = "{{ foreground }}", background = "{{ lighter_background }}" }
background_style = { attributes = "dim" }

[theme.help]
short_key_style = { foreground = "{{ secondary }}" }
short_desc_style = { foreground = "{{ foreground }}" }
full_key_style = { foreground = "{{ secondary }}" }
full_desc_style = { foreground = "{{ foreground }}" }
