# Generated from the active Omarchy palette.
set -g status-position top
set -g status-style 'bg={{ background }},fg={{ secondary }}'
set -g status-left-length 28
set -g status-left '#[fg={{ accent }},bold] A T L A S #[fg={{ muted }},nobold]/ #{?client_prefix,#[fg={{ accent }}]choose key ,}'
set -g status-right-length 55
set -g status-right '#{?#{>:#{client_width},105},#[fg={{ secondary }}]C-Space → f files · m monitor · a agents  ,}#[fg={{ secondary }}]#h '
set -g window-status-format '#[fg={{ secondary }}] #I #W '
set -g window-status-current-format '#[fg={{ accent }},bold] #I #W '
set -g window-status-separator ' '
set -g pane-border-style 'fg={{ muted }}'
set -g pane-active-border-style 'fg={{ accent }}'
set -g pane-border-lines single
set -g message-style 'bg={{ lighter_background }},fg={{ foreground }}'
set -g message-command-style 'bg={{ lighter_background }},fg={{ accent }}'
set -g mode-style 'bg={{ selection_background }},fg={{ selection_foreground }}'
set -g popup-style 'bg={{ background }},fg={{ foreground }}'
set -g popup-border-style 'fg={{ muted }}'
set -g popup-border-lines single
setw -g clock-mode-colour '{{ accent }}'
