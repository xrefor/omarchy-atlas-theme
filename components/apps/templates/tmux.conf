# Generated from the active Omarchy palette.
source-file -q ~/.config/atlas/layout.conf
set -g status-position top
set -g status-style 'bg={{ background }},fg={{ secondary }}'
set -g status-left-length 28
set -g status-left '#[fg={{ accent }},bold] A T L A S #[fg={{ muted }},nobold]/ #{?client_prefix,#[fg={{ accent }}]choose key ,}'
set -g status-right-length 110
set -g status-right '#[fg={{ secondary }}]#{?#{e|>:#{client_width},160},C-Space → f Files · g Git Status · p Ports & Services · n NymVPN · a Agents  ,#{?#{e|>:#{client_width},110},C-Space → f Files · g Git Status · p Ports · n VPN · a Agents  ,}}'
set -g window-status-format '#[fg={{ secondary }}] #I #W '
set -g window-status-current-format '#[fg={{ accent }},bold] #I #W '
set -g window-status-separator ' '
set -g pane-border-style 'fg={{ muted }}'
set -g pane-active-border-style 'fg={{ accent }}'
set -g pane-border-lines single
set -g message-style 'bg={{ lighter_background }},fg={{ foreground }}'
set -g message-command-style 'bg={{ lighter_background }},fg={{ accent }}'
set -g mode-style 'bg={{ selection_background }},fg={{ selection_foreground }}'
set -g popup-style 'bg={{ background }},fg={{ foreground }}'
set -g popup-border-style 'fg={{ muted }}'
set -g popup-border-lines single
setw -g clock-mode-colour '{{ accent }}'

# The classic values above are reapplied on every reload, so changing back from
# framed restores the original appearance. Leave an unset option as classic.
# The second status row is a thin bottom rail, not another window perimeter.
# Save the user's status geometry and focus indicators once, including whether
# their optional second status format exists, so Classic restores it exactly.
if-shell -F '#{==:#{@atlas-layout},framed}' {
    if-shell -F '#{!=:#{@atlas-framed-saved},1}' {
        run-shell 'tmux set-option -g @atlas-classic-status "$(tmux show-options -gv status)"'
        run-shell 'tmux set-option -g @atlas-classic-status-format-1 "$(tmux show-options -gv "status-format[1]")"'
        run-shell 'tmux set-option -g @atlas-classic-pane-indicators "$(tmux show-options -gv pane-border-indicators)"'
        if-shell 'tmux show-options -g status-format | grep -q "^status-format\[1\] "' {
            set -g @atlas-classic-status-format-1-present 1
        } {
            set -g @atlas-classic-status-format-1-present 0
        }
        set -g @atlas-framed-saved 1
    }
    set -g status 2
    set -g status-format[1] '#[fg={{ muted }},bg={{ background }}]#{R:─,#{client_width}}'
    set -g pane-border-indicators arrows
    set -g status-left-length 32
    set -g status-left '#[fg={{ accent }},bold] ATLAS #[fg={{ muted }},nobold]/#[fg={{ secondary }}]#{?#{e|>:#{client_width},110}, WORKSPACE , }#[fg={{ muted }}]│ #{?client_prefix,#[fg={{ accent }}]choose key ,}'
    set -g status-right '#[fg={{ muted }}]#{?#{e|>:#{client_width},160},│ #[fg={{ secondary }}]C-Space → f Files · g Git Status · p Ports & Services · n NymVPN · a Agents  ,#{?#{e|>:#{client_width},110},│ #[fg={{ secondary }}]C-Space → f Files · g Git Status · p Ports · n VPN · a Agents  ,}}'
    set -g window-status-format '#[fg={{ secondary }}] #I #W '
    set -g window-status-current-format '#[fg={{ accent }}]▎#[fg={{ foreground }},bold]#I #W #[nobold]'
    set -g window-status-separator ''
    set -g pane-border-style 'fg={{ muted }}'
    set -g pane-active-border-style 'fg={{ secondary }}'
} {
    if-shell -F '#{==:#{@atlas-framed-saved},1}' {
        set -gF status '#{@atlas-classic-status}'
        if-shell -F '#{==:#{@atlas-classic-status-format-1-present},1}' {
            set -gF status-format[1] '#{@atlas-classic-status-format-1}'
        } {
            set -gu status-format[1]
        }
        set -gF pane-border-indicators '#{@atlas-classic-pane-indicators}'
        set -gu @atlas-framed-saved
        set -gu @atlas-classic-status
        set -gu @atlas-classic-status-format-1
        set -gu @atlas-classic-status-format-1-present
        set -gu @atlas-classic-pane-indicators
    }
}
