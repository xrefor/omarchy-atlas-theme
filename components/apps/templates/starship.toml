# Generated by atlas-theme from the active Omarchy palette.
add_newline = true
command_timeout = 500
palette = "atlas"
format = "$directory($git_branch$git_status)${fill}$cmd_duration\n$character"

[palettes.atlas]
accent = "{{ accent }}"
text = "{{ foreground }}"
secondary = "{{ secondary }}"
error = "{{ bright_red }}"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold text"
read_only_style = "error"
read_only = " [RO]"
truncation_length = 0
truncate_to_repo = false
home_symbol = "~"

[git_branch]
format = "[ / $branch]($style)"
style = "secondary"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "accent"
modified = " · ${count} modified"
untracked = " · ${count} untracked"
staged = " · ${count} staged"
deleted = " · ${count} deleted"
renamed = " · ${count} renamed"
conflicted = " · ${count} conflicted"
stashed = ""
ahead = " · ↑${count}"
behind = " · ↓${count}"
diverged = " · ↑${ahead_count} ↓${behind_count}"

[fill]
symbol = " "

[cmd_duration]
min_time = 2000
format = "[ $duration]($style)"
style = "secondary"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[❯](bold error)"
