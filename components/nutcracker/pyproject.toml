[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-nutcracker"
version = "0.2.0"
description = "ATLAS terminal interface for Nutcracker"
requires-python = ">=3.11"
dependencies = [
  "textual==8.2.8",
  "rich==15.0.0",
  "PyYAML==6.0.3",
]

[project.scripts]
atlas-nutcracker = "atlas_nutcracker.__main__:main"

[tool.setuptools.package-data]
atlas_nutcracker = ["*.tcss"]
