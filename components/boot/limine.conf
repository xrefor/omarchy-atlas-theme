# This is an appearance fragment. The installer derives every colour from
# colors.toml and merges these keys into the existing global Limine section.
interface_branding: ATLAS Bootloader
interface_branding_color: @accent@
interface_help_color: @accent@
interface_help_color_bright: @bright_foreground@
term_background: @background@
backdrop: @background@
term_palette: @dark_background@;@red@;@green@;@brown@;@blue@;@magenta@;@cyan@;@foreground@
term_palette_bright: @muted@;@bright_red@;@bright_green@;@bright_yellow@;@bright_blue@;@bright_magenta@;@bright_cyan@;@bright_foreground@
term_foreground: @foreground@
term_foreground_bright: @bright_foreground@
term_background_bright: @lighter_background@
