<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Resolve explicitly requested generic families before the system aliases.
       Explicit family requests and the system glyph fallbacks remain intact. -->
  <match target="pattern">
    <test name="family" qual="first"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IBM Plex Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>ui-monospace</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IBM Plex Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="first"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>IBM Plex Sans</string></edit>
  </match>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
